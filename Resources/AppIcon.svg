<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Proportions match generate_app_icon.swift exactly (all fractions of 512):
      tip            = (241, 241)   [optical offset 0.03 × 512 = 15 from centre]
      cursorHeight   = 0.42 × 512 = 215
      cursorWidth    = cursorHeight × 0.78 = 168
      inner arc r    = 0.19 × 512 = 97     arc stroke = 0.048 × 512 = 25
      outer arc r    = 0.27 × 512 = 138    bg corner  = 0.225 × 512 = 115
      cursor outline = 0.030 × 512 = 15

    Cursor: left edge is a straight vertical line (tip straight down to the
    bottom of the shaft), matching the reference image. Because the tail
    flares out to only one side, the shape's own angular span (viewed from
    the tip) isn't symmetric — it runs from due south to about 33° past it.

    Arc gap: sized and positioned to bracket that span with clearance on
    both sides, rather than one edge touching the arc.
  -->

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#F0F0F0"/>

  <!-- Inner arc (62° gap, bracketing the cursor's vertical left edge) -->
  <path d="M 220.8,335.9 A 97,97,0,1,1,315.3,303.4"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Outer arc (62° gap, bracketing the cursor's vertical left edge) -->
  <path d="M 212.3,376.0 A 138,138,0,1,1,346.7,329.7"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Cursor arrow; tip at (241, 241), left edge vertical. -->
  <path d="M 241,241 L 241,432.2 L 278.2,390.2 L 301.6,456.0 L 320.2,444.0 L 296.9,378.4 L 343.5,378.4 Z"
        fill="white" stroke="#3C3C3C" stroke-width="15" stroke-linejoin="round"/>
</svg>
