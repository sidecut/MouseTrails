<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Proportions match generate_app_icon.swift exactly (all fractions of 512):
      tip            = (241, 241)   [optical offset 0.03 × 512 = 15 from centre]
      cursorHeight   = 0.42 × 512 = 215
      cursorWidth    = cursorHeight × 0.78 = 168
      inner arc r    = 0.19 × 512 = 97     arc stroke = 0.048 × 512 = 25
      outer arc r    = 0.27 × 512 = 138    bg corner  = 0.225 × 512 = 115
      cursor outline = 0.030 × 512 = 15

    Cursor: built pointing straight down (tip at the centre, shaft running
    south), then rotated -13.5° about the tip — halfway between a vertical
    left edge (0°) and fully bisecting the SE gap (45°).

    Arc gap: sized and positioned to bracket the rotated cursor's angular
    span with clearance on both sides, rather than one edge touching it.
  -->

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#F0F0F0"/>

  <!-- Inner arc (63° gap) -->
  <path d="M 241.8,338.0 A 97,97,0,1,1,327.8,284.3"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Outer arc (63° gap) -->
  <path d="M 242.2,379.0 A 138,138,0,1,1,364.5,302.6"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Cursor arrow; tip at (241, 241), rotated -13.5° from straight-down. -->
  <path d="M 241,241 L 285.6,426.9 L 312.0,377.4 L 350.1,436.0 L 365.4,419.9 L 327.4,361.6 L 372.7,350.7 Z"
        fill="white" stroke="#3C3C3C" stroke-width="15" stroke-linejoin="round"/>
</svg>
