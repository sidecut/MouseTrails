<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Proportions match generate_app_icon.swift exactly (all fractions of 512):
      tip            = (241, 241)   [optical offset 0.03 × 512 = 15 from centre]
      cursorHeight   = 0.42 × 512 = 215
      cursorWidth    = cursorHeight × 0.78 = 168
      inner arc r    = 0.19 × 512 = 97     arc stroke = 0.048 × 512 = 25
      outer arc r    = 0.27 × 512 = 138    bg corner  = 0.225 × 512 = 115
      cursor outline = 0.030 × 512 = 15

    Arc gap: the arcs leave a 64° gap centred on the SE bisector (45° from
    east, measuring clockwise since SVG y points down) so the cursor sits
    inside the gap with clearance on both sides, rather than one edge
    touching the arc.

    Cursor: built pointing straight down (tip at the centre, shaft running
    south), then rotated -27° about the tip. The shape isn't symmetric
    around its own "straight down" axis — the left edge is a straight
    vertical line, but the tail flares out to only one side — so its
    tip-relative angular span already leans toward the gap's SE bisector;
    27° (not the full 45° to the bisector) centres that lopsided span in
    the gap without the flared side crossing into the arc.
  -->

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#F0F0F0"/>

  <!-- Inner arc (64° gap, centred SE) -->
  <path d="M 262.8,335.5 A 97,97,0,1,1,335.5,262.8"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Outer arc (64° gap, centred SE) -->
  <path d="M 272.0,375.5 A 138,138,0,1,1,375.5,272.0"
        fill="none" stroke="#FF9F0A" stroke-width="25" stroke-linecap="round"/>

  <!-- Cursor arrow; tip at (241, 241), rotated -27° from straight-down. -->
  <path d="M 241,241 L 327.8,411.3 L 341.9,357.1 L 392.6,405.1 L 403.7,385.9 L 353.1,338.1 L 394.7,316.9 Z"
        fill="white" stroke="#3C3C3C" stroke-width="15" stroke-linejoin="round"/>
</svg>
