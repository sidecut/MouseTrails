<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Proportions match generate_app_icon.swift exactly (all fractions of 512):
      tip            = (241, 241)   [optical offset 0.03 × 512 = 15 from centre]
      cursorHeight   = 0.42 × 512 = 215
      cursorWidth    = cursorHeight × 0.611 = 131
      inner arc r    = 0.19 × 512 = 97     arc stroke = 0.048 × 512 = 25
      outer arc r    = 0.27 × 512 = 138    bg corner  = 0.225 × 512 = 115
      cursor outline = 0.030 × 512 = 15

    Arc direction: each arc starts at the east point (cx+r, cy) and sweeps
    counterclockwise on-screen (SVG sweep=0) with large-arc=1 to the south
    point (cx, cy+r).  This covers E→N→W→S (270°), leaving the SE gap where
    the cursor body points.
  -->

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#F0F0F0"/>

  <!-- Inner 270° arc (gap SE) -->
  <path d="M 338,241 A 97,97,0,1,0,241,338"
        fill="none" stroke="#3C3C3C" stroke-width="25" stroke-linecap="round"/>

  <!-- Outer 270° arc (gap SE) -->
  <path d="M 379,241 A 138,138,0,1,0,241,379"
        fill="none" stroke="#3C3C3C" stroke-width="25" stroke-linecap="round"/>

  <!-- Cursor arrow; tip at (241, 241).
       AppKit normalised point (px, py) maps to SVG as:
         x = 241 + px × 131
         y = 241 + (1 − py) × 215   (SVG y increases downward) -->
  <path d="M 241,241 L 241,432 L 270,390 L 288,456 L 303,444 L 285,378 L 321,378 Z"
        fill="white" stroke="#3C3C3C" stroke-width="15" stroke-linejoin="round"/>
</svg>
